apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  # CHANGED: align StorageClass name with PV/PVC references below.
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: trello-groomer-config-volume
  labels:
    directory: config
spec:
  capacity:
    storage: 5Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    # NOTE: this directory must exist
    path: /home/picocluster/Volumes/trello-groomer-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pc2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trello-groomer-config-claim
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Mi
  selector:
    matchLabels:
      directory: config
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: trello-groomer-cache-volume
  labels:
    directory: cache
spec:
  capacity:
    storage: 5Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    # NOTE: this directory must exist
    path: /home/picocluster/Volumes/trello-groomer-cache
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pc2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trello-groomer-cache-claim
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Mi
  selector:
    matchLabels:
      directory: cache
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: trello-groomer-log-volume
  labels:
    directory: log
spec:
  capacity:
    storage: 5Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    # NOTE: this directory must exist
